<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="soapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fdfbf7" stop-opacity="0"/>
    </radialGradient>

    <!-- Soap Bar 1 Gradient (Herbal Neem / Green) -->
    <linearGradient id="soapNeem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soap Bar 2 Gradient (Golden Turmeric & Groundnut Oil) -->
    <linearGradient id="soapHaldi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Soap Bar 3 Top Perspective Gradient -->
    <linearGradient id="soapTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>

    <!-- Paper band wrapper gradient -->
    <linearGradient id="paperBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03331b"/>
      <stop offset="50%" stop-color="#095835"/>
      <stop offset="100%" stop-color="#03331b"/>
    </linearGradient>

    <filter id="soapShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular background backdrop -->
  <circle cx="200" cy="200" r="170" fill="url(#soapGlow)"/>

  <!-- Base Ground Shadow -->
  <ellipse cx="200" cy="355" rx="120" ry="16" fill="#064e3b" opacity="0.2"/>

  <!-- Soap Group -->
  <g filter="url(#soapShadow)">
    
    <!-- BACKGROUND SOAP BAR (Green Herbal Neem Bar slightly tilted) -->
    <g transform="translate(-30, -25) rotate(-8 180 220)">
      <rect x="130" y="160" width="160" height="95" rx="16" fill="url(#soapNeem)"/>
      <!-- Embossed Leaf inside background bar -->
      <path d="M 210 185 C 230 195, 230 225, 210 235 C 190 225, 190 195, 210 185 Z" fill="#047857" opacity="0.5"/>
      <line x1="210" y1="185" x2="210" y2="235" stroke="#a7f3d0" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- FOREGROUND MAIN SOAP BAR (Golden Turmeric & Pure Oil) -->
    <!-- Soap Body -->
    <rect x="110" y="195" width="180" height="115" rx="20" fill="url(#soapHaldi)"/>
    
    <!-- Top Chamfer highlight -->
    <rect x="115" y="198" width="170" height="15" rx="10" fill="#fef9c3" opacity="0.6"/>
    
    <!-- Left edge curve highlight -->
    <path d="M 112 210 Q 110 250 115 295" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none"/>

    <!-- Kraft Paper Packaging Band Wrapped Around Bar -->
    <rect x="155" y="190" width="90" height="125" rx="4" fill="url(#paperBand)" stroke="#f5b027" stroke-width="1.5"/>
    
    <!-- Golden stitch borders on wrapper -->
    <line x1="158" y1="193" x2="158" y2="312" stroke="#f5b027" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="242" y1="193" x2="242" y2="312" stroke="#f5b027" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Wrapper Text & Badge -->
    <text x="200" y="215" font-family="Outfit, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">ORSOLUM</text>
    <text x="200" y="225" font-family="sans-serif" font-weight="800" font-size="6.5" fill="#f5b027" text-anchor="middle" letter-spacing="1.5">ORGANIC SOIL</text>

    <!-- Small Circular Seal on Band -->
    <circle cx="200" cy="245" r="14" fill="#ffffff"/>
    <circle cx="200" cy="245" r="12" fill="#095835"/>
    <text x="200" y="244" font-family="sans-serif" font-weight="900" font-size="7" fill="#f5b027" text-anchor="middle">78%</text>
    <text x="200" y="251" font-family="sans-serif" font-weight="800" font-size="5" fill="#ffffff" text-anchor="middle">TFM</text>

    <!-- Soap Subtitle -->
    <text x="200" y="272" font-family="Outfit, sans-serif" font-weight="900" font-size="8.5" fill="#ffffff" text-anchor="middle">COLD PRESSED</text>
    <text x="200" y="282" font-family="sans-serif" font-weight="800" font-size="7" fill="#fef08a" text-anchor="middle">HERBAL BATH BAR</text>
    <text x="200" y="294" font-family="sans-serif" font-weight="600" font-size="6" fill="#a7f3d0" text-anchor="middle">Groundnut Oil &amp; Neem</text>

    <!-- Weight Tag -->
    <rect x="180" y="300" width="40" height="7" rx="3" fill="#f5b027"/>
    <text x="200" y="305.5" font-family="sans-serif" font-weight="900" font-size="5.5" fill="#03331b" text-anchor="middle">PACK OF 3 × 125G</text>

    <!-- Natural botanical herbs floating around -->
    <!-- Neem Leaf -->
    <path d="M 85 240 C 95 215, 120 220, 115 245 C 100 245, 90 255, 85 240 Z" fill="#10b981"/>
    <line x1="85" y1="240" x2="115" y2="245" stroke="#047857" stroke-width="1"/>

    <!-- Turmeric piece / flower petal -->
    <ellipse cx="305" cy="225" rx="12" ry="7" transform="rotate(30 305 225)" fill="#f59e0b"/>
    <ellipse cx="305" cy="225" rx="8" ry="4" transform="rotate(30 305 225)" fill="#fbbf24"/>

    <!-- Froth & foam bubbles -->
    <circle cx="105" cy="190" r="10" fill="#ffffff" opacity="0.8"/>
    <circle cx="100" cy="188" r="3" fill="#ecfdf5"/>
    <circle cx="118" cy="178" r="6" fill="#ffffff" opacity="0.7"/>
    <circle cx="290" cy="190" r="9" fill="#ffffff" opacity="0.8"/>
    <circle cx="286" cy="187" r="3" fill="#ecfdf5"/>
  </g>
</svg>

